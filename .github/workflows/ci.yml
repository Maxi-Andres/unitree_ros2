name: CI (our code only)
on: [push, pull_request]

# This is a fork of Unitree's repo. Only robot_executor/ and robot_camera_bridge/ are ours;
# ruff.toml's `include` and the paths filter below keep CI off the vendor tree.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"     # the ROS2 Humble devcontainer's interpreter
      - name: Install tools
        run: pip install ruff pytest
      - name: Lint
        run: ruff check --output-format=github
      - name: Test the command catalogs
        # See the note in the sibling repos: `bash -e` makes `; rc=$?` unreachable.
        run: cd robot_executor && { pytest -q || [ $? -eq 5 ]; }
      - name: Test the camera bridge framing
        # No cv2 and no rclpy here on purpose — `tests/conftest.py` stubs both, so the
        # framing loop is testable without the Humble devcontainer. Do NOT add them to the
        # install step: if the stubs stop being enough, that must fail loudly here rather
        # than quietly start depending on a 200 MB wheel.
        run: cd robot_camera_bridge && { pytest -q || [ $? -eq 5 ]; }
