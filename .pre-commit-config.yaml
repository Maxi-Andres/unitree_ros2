# Commit gate for OUR code in this fork (robot_executor/, robot_camera_bridge/). Everything
# else here is Unitree's and is excluded — see the `exclude` regex and ruff.toml's include.
fail_fast: false
exclude: '^(?!robot_executor/|robot_camera_bridge/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check --force-exclude
        language: system
        types: [python]
      - id: pytest-executor
        name: pytest (robot_executor)
        entry: bash -c 'cd robot_executor && python3 -m pytest -q'
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-camera-bridge
        name: pytest (robot_camera_bridge)
        # Runs outside the devcontainer: tests/conftest.py stubs cv2 and rclpy so the JPEG
        # framing loop is testable with no ROS2 installed and the robot powered off.
        entry: bash -c 'cd robot_camera_bridge && python3 -m pytest -q'
        language: system
        pass_filenames: false
        always_run: true
