# Lint + format for OUR code inside the unitree_ros2 fork. Everything else here is Unitree's
# and is never touched — the include list is the whole scope of this config.
#
# target-version is 3.10: this code runs inside the ROS2 Humble devcontainer, not on the
# robot and not on the host.
target-version = "py310"
line-length = 100
include = ["robot_executor/**/*.py", "robot_camera_bridge/**/*.py"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
  "S101", "S603", "S607", "E501",
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode: the prose uses real typography on purpose
  "S110",    # try-except-pass: deliberate — logging must never break a control path
  "SIM105",  # explicit try/except reads clearer than contextlib.suppress in teardown paths
  "S310",    # urlopen with a configured URL (the relay endpoint) — audited, not user input
]

[format]
quote-style = "double"
